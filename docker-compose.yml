version: '3.8'

services:
  database:
    image: postgis/postgis:16-3.4
    container_name: aquasense_db
    restart: always
    environment:
      POSTGRES_DB: aquasense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
