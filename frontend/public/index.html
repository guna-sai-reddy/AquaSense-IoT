<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AquaSense-IoT</title>
  <meta name="theme-color" content="#059669">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .logo {
      width: 84px;
      height: 84px;
      background: #059669;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      color: white;
      box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);
      margin-bottom: 20px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #34d399;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">A</div>
  <div class="title">AquaSense-IoT</div>
  <div class="subtitle">Precision Irrigation Decision Support</div>
  <div class="spinner"></div>

  <script>
    // In Capacitor native app, redirect or bridge to the app server
    window.addEventListener('DOMContentLoaded', () => {
      // Connect to local or remote Next.js server
      const targetUrl = window.location.origin;
      if (window.location.pathname === '/index.html' || window.location.pathname === '/') {
        // Allow smooth transition
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      }
    });
  </script>
</body>
</html>
